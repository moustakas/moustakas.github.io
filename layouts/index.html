{{ define "hero" }}
{{ with resources.Get "images/hero.png" }}
{{ $small := .Resize "1000x webp q80" }}
{{ $large := .Resize "2000x webp q80" }}
<div class="hero">
  <img src="{{ $large.RelPermalink }}"
       srcset="{{ $small.RelPermalink }} 1000w, {{ $large.RelPermalink }} 2000w"
       sizes="100vw" width="{{ $large.Width }}" height="{{ $large.Height }}"
       alt="John Moustakas silhouetted on a ridge beside a telescope dome at dusk">
</div>
{{ end }}
{{ end }}

{{ define "main" }}
<h1>{{ site.Title }}</h1>
{{ with .Params.subtitle }}<p class="subtitle">{{ . }}</p>{{ end }}
{{ .Content }}
{{ end }}
